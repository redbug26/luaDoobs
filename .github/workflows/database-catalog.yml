name: Update database catalog

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: database-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-catalog:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Generate and publish the catalog when changed
        env:
          CATALOG_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            python3 scripts/build_database_catalog.py
            git add -- databases/all.json
            if git diff --cached --quiet -- databases/all.json; then
              echo "Catalog already up to date."
              exit 0
            fi
            git commit -m "Update database catalog"
            if git push origin "HEAD:refs/heads/$CATALOG_BRANCH"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              # Another push may have advanced the branch. Rebuild from its latest metadata.
              # This reset affects only the disposable Actions checkout, never a local workspace.
              git fetch origin "refs/heads/$CATALOG_BRANCH"
              git reset --hard FETCH_HEAD
            fi
          done
          echo "Unable to publish the catalog after three attempts." >&2
          exit 1
